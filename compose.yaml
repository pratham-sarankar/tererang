services:
  frontend:
    build:
      context: .
      secrets:
        - frontend_env
    ports:
      - "127.0.0.1:${DOCKER_WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 8080
      NODE_ENV: production
    volumes:
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
secrets:
  frontend_env:
    file: ./.env
